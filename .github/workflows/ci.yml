name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # â”€â”€ ops-core: routing gate, invariants, HTTP, MCP, work orders â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ops-core:
    name: ops-core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ops-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/ops-core/package-lock.json
      - run: npm ci --workspaces=false
      - name: Test suite (routing + invariants + HTTP + MCP + work orders)
        run: npm test
      - name: Doctor (9-fixture route grid + infra guards)
        run: npm run doctor

  # â”€â”€ council: smoke + hardening â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  council:
    name: council tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/council
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke test (routing, dedup, safety gates)
        run: node scripts/smoke_test.js
      - name: Hardening test (council_may_send invariant, safety gates)
        run: node scripts/hardening_test.js
      - name: Full check
        run: node scripts/check_all.js

  # â”€â”€ security: no hardcoded secrets, no private IPs â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  security-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded phone numbers
        run: |
          if grep -rn "\+336\|\+337" --include="*.js" --include="*.sh" --include="*.py" --include="*.md" .; then
            echo "FAIL: hardcoded phone numbers found"
            exit 1
          fi
          echo "PASS: no hardcoded phone numbers"
      - name: Scan for private server IPs
        run: |
          # Allow only documentation/example references, block real IPs in code
          if grep -rn "187\.127\.\|57\.130\.58\.\|43\.118\." --include="*.js" --include="*.sh" --include="*.py" .; then
            echo "FAIL: private server IP found in code"
            exit 1
          fi
          echo "PASS: no private server IPs in code"
      - name: Scan for committed secrets
        run: |
          PATTERNS="VBOARD_EVENT_SINK_TOKEN=ey\|VBOARD_API_TOKEN=vboard_\|VBOARD_COUNCIL_TOKEN=[a-f0-9]\{32\}"
          if grep -rn "$PATTERNS" --include="*.js" --include="*.sh" --include="*.py" --include="*.env" . 2>/dev/null | grep -v ".env.example"; then
            echo "FAIL: committed secret detected"
            exit 1
          fi
          echo "PASS: no committed secrets"
      - name: council_may_send invariant (council safety gate must never be true)
        run: |
          if grep -rn "council_may_send.*true\|council_may_send: true" --include="*.js" packages/; then
            echo "FAIL: council_may_send set to true somewhere"
            exit 1
          fi
          echo "PASS: council_may_send invariant holds in source"

  # â”€â”€ gate: all jobs must pass before merge â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  all-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [ops-core, council, security-scan]
    steps:
      - run: echo "All CI checks passed."

