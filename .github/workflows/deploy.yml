name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  # ── Docker Compose deploy — single server (primary) ───────────────────────
  deploy:
    name: Deploy → production server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to server
        run: |
          rsync -az --delete \
            --exclude=.git \
            --exclude='packages/*/node_modules' \
            --exclude='packages/*/.secrets' \
            --exclude='.env' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/v-board/

      - name: Build and restart containers
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            set -e
            cd /opt/v-board

            # Pull latest images and rebuild changed services
            docker compose build --no-cache ops-core council

            # Rolling restart: council first (ops-core depends on it)
            docker compose up -d --no-deps council
            sleep 5

            # Verify council health before bringing up ops-core
            docker compose exec council node -e \"
              require('http').get('http://127.0.0.1:8787/health', r => {
                process.exit(r.statusCode === 200 ? 0 : 1)
              }).on('error', () => process.exit(1))
            \"

            docker compose up -d --no-deps ops-core
            sleep 5

            # Verify ops-core health
            curl -sf http://127.0.0.1:8788/health | grep '\"ok\":true'

            # Restart runner (picks up new bin scripts)
            docker compose up -d --no-deps runner

            echo '✓ Deployment complete'
            docker compose ps
          "

  # ── Optional: two-server deploy (uncomment if using separate servers) ──────
  # deploy-server1:
  #   name: Deploy → server 1 (ops-core + runner)
  #   ...
  # deploy-server2:
  #   name: Deploy → server 2 (council)
  #   ...
  #
  # See deploy/README.md for two-server manual deploy instructions.
