version: "3.9"

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# VBOARD V-Board â€” single-server, multi-container deployment
#
# Services:
#   ops-core      â€” routing gate, MCP server, HTTP API (port 8788)
#   council       â€” AI analysis / hard-work engine (port 8787, internal only)
#   runner        â€” cron agent executor (no exposed port)
#   meeting-room  â€” live meeting AI advisor â€” CFO/CTO/COO/CRM (port 8790)
#   ollama        â€” optional local LLM backend (port 11434, internal only)
#
# All services share the `vboard-net` bridge network and communicate
# by service name (e.g. http://council:8787/route).
#
# Quick start:
#   cp .env.example .env   # fill in tokens
#   docker compose up -d
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

networks:
  vboard-net:
    driver: bridge

volumes:
  workspace:            # shared workspace: docs, context, reports
  ops-core-data:        # ops-core data root (work orders, finance, logs)
  meeting-room-data:    # meeting evidence chain (transcripts, decisions, media)
  ollama-data:          # ollama model cache

services:

  # â”€â”€ ops-core â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ops-core:
    build:
      context: packages/ops-core
      dockerfile: Dockerfile
    container_name: vboard-ops-core
    restart: unless-stopped
    networks: [vboard-net]
    ports:
      - "${OPS_CORE_HOST:-127.0.0.1}:${OPS_CORE_PORT:-8788}:8788"
    volumes:
      - ops-core-data:/data
      - workspace:/workspace:ro
    environment:
      NODE_ENV: production
      VBOARD_API_HOST: "0.0.0.0"
      VBOARD_API_PORT: "8788"
      VBOARD_API_TOKEN: "${VBOARD_API_TOKEN}"
      VBOARD_API_KEYS_JSON: "${VBOARD_API_KEYS_JSON:-}"
      VBOARD_DATA_ROOT: /data
      VBOARD_COUNCIL_URL: "http://council:8787/route"
      VBOARD_COUNCIL_TOKEN: "${VBOARD_COUNCIL_TOKEN}"
      VBOARD_COUNCIL_TIMEOUT_MS: "${VBOARD_COUNCIL_TIMEOUT_MS:-120000}"
      VBOARD_OWNER_WHATSAPP: "${VBOARD_OWNER_WHATSAPP:-}"
      VBOARD_SERVER_NAME: "ops-core"
      VBOARD_LOG_LEVEL: "${VBOARD_LOG_LEVEL:-info}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      VBOARD_SUPABASE_ENABLED: "${VBOARD_SUPABASE_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8788/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      council:
        condition: service_healthy

  # â”€â”€ council â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  council:
    build:
      context: packages/council
      dockerfile: Dockerfile
    container_name: vboard-council
    restart: unless-stopped
    networks: [vboard-net]
    # council is NOT exposed to the host â€” ops-core/runner reach it by name
    expose: ["8787"]
    volumes:
      - workspace:/workspace:ro
    environment:
      NODE_ENV: production
      VBOARD_COUNCIL_HOST: "0.0.0.0"
      VBOARD_COUNCIL_PORT: "8787"
      VBOARD_COUNCIL_TOKEN: "${VBOARD_COUNCIL_TOKEN}"
      LLM_API_TOKEN: "${LLM_API_TOKEN:-}"
      LLM_FALLBACK_API_KEY: "${LLM_FALLBACK_API_KEY:-}"
      VBOARD_DAILY_BUDGET_USD: "${VBOARD_DAILY_BUDGET_USD:-3.00}"
      VBOARD_FORCE_CHEAP_MODE: "${VBOARD_FORCE_CHEAP_MODE:-0}"
      OLLAMA_BASE_URL: "http://ollama:11434"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # â”€â”€ runner â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  runner:
    build:
      context: packages/runner
      dockerfile: Dockerfile
    container_name: vboard-runner
    restart: unless-stopped
    networks: [vboard-net]
    volumes:
      - workspace:/workspace
    environment:
      VBOARD_WORKSPACE: /workspace
      VBOARD_COUNCIL_URL: "http://council:8787/route"
      VBOARD_COUNCIL_TOKEN: "${VBOARD_COUNCIL_TOKEN}"
      VBOARD_OWNER_WHATSAPP: "${VBOARD_OWNER_WHATSAPP}"
      VBOARD_ASSISTANT_WHATSAPP: "${VBOARD_ASSISTANT_WHATSAPP:-}"
      WHATSAPP_API_URL: "${WHATSAPP_API_URL:-}"
      WHATSAPP_API_TOKEN: "${WHATSAPP_API_TOKEN:-}"
      GMAIL_CREDENTIALS_JSON: "${GMAIL_CREDENTIALS_JSON:-}"
      GMAIL_TOKEN_JSON: "${GMAIL_TOKEN_JSON:-}"
      BANK_API_AUTH: "${BANK_API_AUTH:-}"
      MAIL_TRIAGE_LIMIT: "${MAIL_TRIAGE_LIMIT:-20}"
      VBOARD_DAILY_BUDGET_USD: "${VBOARD_DAILY_BUDGET_USD:-3.00}"
    depends_on:
      ops-core:
        condition: service_healthy
      council:
        condition: service_healthy

  # â”€â”€ meeting-room â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  meeting-room:
    build:
      context: packages/meeting-room
      dockerfile: Dockerfile
    container_name: vboard-meeting-room
    restart: unless-stopped
    networks: [vboard-net]
    # Localhost-only bind â€” put nginx or Traefik in front for HTTPS
    ports:
      - "${MEETING_ROOM_HOST:-127.0.0.1}:${MEETING_ROOM_PORT:-8790}:8790"
    volumes:
      - meeting-room-data:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      VBOARD_DATA_ROOT: /workspace
      MEETING_ROOM_REQUIRE_TOKEN: "true"
      MEETING_ROOM_API_TOKEN: "${MEETING_ROOM_API_TOKEN}"
      # AI providers â€” council (at least one required)
      PRIMARY_LLM_API_KEY: "${PRIMARY_LLM_API_KEY:-}"
      REVIEWER_LLM_API_KEY: "${REVIEWER_LLM_API_KEY:-}"
      CHAIR_LLM_API_KEY: "${CHAIR_LLM_API_KEY:-}"
      # Voice
      VOICE_API_KEY: "${VOICE_API_KEY:-}"
      STT_API_KEY: "${STT_API_KEY:-}"
      # Avatar (optional)
      AVATAR_API_KEY: "${AVATAR_API_KEY:-}"
      AVATAR_API_BASE_URL: "${AVATAR_API_BASE_URL:-https://avatar-provider.example}"
      # LiveKit (Phase 2 â€” optional)
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # â”€â”€ ollama (optional local LLM) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ollama:
    image: ollama/ollama:latest
    container_name: vboard-ollama
    restart: unless-stopped
    networks: [vboard-net]
    expose: ["11434"]
    volumes:
      - ollama-data:/root/.ollama
    profiles: ["ollama"]   # opt-in: docker compose --profile ollama up -d

