version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AZZCO V-Board — single-server, multi-container deployment
#
# Services:
#   ops-core      — routing gate, MCP server, HTTP API (port 8788)
#   council       — AI analysis / hard-work engine (port 8787, internal only)
#   runner        — cron agent executor (no exposed port)
#   meeting-room  — live meeting AI advisor — CFO/CTO/COO/CRM (port 8790)
#   ollama        — optional local LLM backend (port 11434, internal only)
#
# All services share the `azzco-net` bridge network and communicate
# by service name (e.g. http://council:8787/route).
#
# Quick start:
#   cp .env.example .env   # fill in tokens
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  azzco-net:
    driver: bridge

volumes:
  workspace:            # shared workspace: docs, context, reports
  ops-core-data:        # ops-core data root (work orders, finance, logs)
  meeting-room-data:    # meeting evidence chain (transcripts, decisions, media)
  ollama-data:          # ollama model cache

services:

  # ── ops-core ──────────────────────────────────────────────────────────────
  ops-core:
    build:
      context: packages/ops-core
      dockerfile: Dockerfile
    container_name: azzco-ops-core
    restart: unless-stopped
    networks: [azzco-net]
    ports:
      - "${OPS_CORE_HOST:-127.0.0.1}:${OPS_CORE_PORT:-8788}:8788"
    volumes:
      - ops-core-data:/data
      - workspace:/workspace:ro
    environment:
      NODE_ENV: production
      AZZCO_API_HOST: "0.0.0.0"
      AZZCO_API_PORT: "8788"
      AZZCO_API_TOKEN: "${AZZCO_API_TOKEN}"
      AZZCO_API_KEYS_JSON: "${AZZCO_API_KEYS_JSON:-}"
      AZZCO_DATA_ROOT: /data
      AZZCO_COUNCIL_URL: "http://council:8787/route"
      AZZCO_COUNCIL_TOKEN: "${AZZCO_COUNCIL_TOKEN}"
      AZZCO_COUNCIL_TIMEOUT_MS: "${AZZCO_COUNCIL_TIMEOUT_MS:-120000}"
      AZZCO_OWNER_WHATSAPP: "${AZZCO_OWNER_WHATSAPP:-}"
      AZZCO_SERVER_NAME: "ops-core"
      AZZCO_LOG_LEVEL: "${AZZCO_LOG_LEVEL:-info}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      AZZCO_SUPABASE_ENABLED: "${AZZCO_SUPABASE_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8788/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      council:
        condition: service_healthy

  # ── council ───────────────────────────────────────────────────────────────
  council:
    build:
      context: packages/council
      dockerfile: Dockerfile
    container_name: azzco-council
    restart: unless-stopped
    networks: [azzco-net]
    # council is NOT exposed to the host — ops-core/runner reach it by name
    expose: ["8787"]
    volumes:
      - workspace:/workspace:ro
    environment:
      NODE_ENV: production
      AZZCO_COUNCIL_HOST: "0.0.0.0"
      AZZCO_COUNCIL_PORT: "8787"
      AZZCO_COUNCIL_TOKEN: "${AZZCO_COUNCIL_TOKEN}"
      HUGGINGFACE_TOKEN: "${HUGGINGFACE_TOKEN:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      AZZCO_DAILY_BUDGET_USD: "${AZZCO_DAILY_BUDGET_USD:-3.00}"
      AZZCO_FORCE_CHEAP_MODE: "${AZZCO_FORCE_CHEAP_MODE:-0}"
      OLLAMA_BASE_URL: "http://ollama:11434"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── runner ────────────────────────────────────────────────────────────────
  runner:
    build:
      context: packages/runner
      dockerfile: Dockerfile
    container_name: azzco-runner
    restart: unless-stopped
    networks: [azzco-net]
    volumes:
      - workspace:/workspace
    environment:
      AZZCO_WORKSPACE: /workspace
      AZZCO_COUNCIL_URL: "http://council:8787/route"
      AZZCO_COUNCIL_TOKEN: "${AZZCO_COUNCIL_TOKEN}"
      AZZCO_OWNER_WHATSAPP: "${AZZCO_OWNER_WHATSAPP}"
      AZZCO_ASSISTANT_WHATSAPP: "${AZZCO_ASSISTANT_WHATSAPP:-}"
      WHATSAPP_API_URL: "${WHATSAPP_API_URL:-}"
      WHATSAPP_API_TOKEN: "${WHATSAPP_API_TOKEN:-}"
      GMAIL_CREDENTIALS_JSON: "${GMAIL_CREDENTIALS_JSON:-}"
      GMAIL_TOKEN_JSON: "${GMAIL_TOKEN_JSON:-}"
      QONTO_AUTH: "${QONTO_AUTH:-}"
      MAIL_TRIAGE_LIMIT: "${MAIL_TRIAGE_LIMIT:-20}"
      AZZCO_DAILY_BUDGET_USD: "${AZZCO_DAILY_BUDGET_USD:-3.00}"
    depends_on:
      ops-core:
        condition: service_healthy
      council:
        condition: service_healthy

  # ── meeting-room ─────────────────────────────────────────────────────────
  meeting-room:
    build:
      context: packages/meeting-room
      dockerfile: Dockerfile
    container_name: azzco-meeting-room
    restart: unless-stopped
    networks: [azzco-net]
    # Localhost-only bind — put nginx or Traefik in front for HTTPS
    ports:
      - "${MEETING_ROOM_HOST:-127.0.0.1}:${MEETING_ROOM_PORT:-8790}:8790"
    volumes:
      - meeting-room-data:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      AZZCO_DATA_ROOT: /workspace
      MEETING_ROOM_REQUIRE_TOKEN: "true"
      MEETING_ROOM_API_TOKEN: "${MEETING_ROOM_API_TOKEN}"
      # AI providers — council (at least one required)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      # Voice
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      # Avatar (optional)
      TAVUS_API_KEY: "${TAVUS_API_KEY:-}"
      TAVUS_BASE_URL: "${TAVUS_BASE_URL:-https://tavusapi.com}"
      # LiveKit (Phase 2 — optional)
      LIVEKIT_URL: "${LIVEKIT_URL:-}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── ollama (optional local LLM) ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: azzco-ollama
    restart: unless-stopped
    networks: [azzco-net]
    expose: ["11434"]
    volumes:
      - ollama-data:/root/.ollama
    profiles: ["ollama"]   # opt-in: docker compose --profile ollama up -d
