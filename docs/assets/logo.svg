<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1a14"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </radialGradient>
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eca6c"/>
      <stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a020"/>
      <stop offset="100%" stop-color="#c87a10"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="url(#ring)" stroke-width="1.5"/>
  <!-- inner subtle ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#2a2418" stroke-width="1"/>
  <!-- V mark -->
  <path d="M18 18 L32 46 L46 18" fill="none" stroke="url(#vgrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- center dot -->
  <circle cx="32" cy="46" r="2.5" fill="#7eca6c"/>
</svg>
